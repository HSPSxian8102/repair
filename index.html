<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設備線上報修系統 — 國立臺南大學附屬高級中學</title>
    <script>
      // GitHub Pages SPA redirect handler
      (function(l) {
        if (l.search && l.search[1] === 'p') {
          var params = l.search.slice(1).split('&').reduce(function(acc, s) {
            var r = s.split('=')
            acc[r[0]] = r[1] ? decodeURIComponent(r[1].replace(/~and~/g, '&')) : ''
            return acc
          }, {})
          var path = (params.p || '') + (params.q ? '?' + params.q : '');
          window.history.replaceState(null, null, '/repair' + path + l.hash)
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
